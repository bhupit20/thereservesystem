<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Existing Patient | The Reserve System™</title>
    <meta name="description" content="Use The Reserve System™ to organize a next visit or referral conversation." />
    <link rel="icon" href="../assets/mark.svg" type="image/svg+xml"/><link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="../styles.css?v=20260731-logo-fix" />
    <script src="../script.js" defer></script>
  </head>
  <body><header class="landing-header"><div class="container landing-nav"><a class="wordmark" href="../index.html"><img class="wordmark-mark" src="../assets/mark.svg" alt="" aria-hidden="true" />THE RESERVE SYSTEM</a></div></header>
    <main class="page-hero">
      <div class="narrow">
        <p class="eyebrow">Existing patient</p>
        <h1>Share the framework carefully.</h1>
        <p class="lead">
          Use The Reserve System™ to organize your next visit or share it with someone whose story
          can still be changed.
        </p>
        <div class="mailchimp-placeholder result-gate">
          <div class="result-gate-header">
            <h3>Continue as an existing patient</h3>
            <p>We’ll send the patient-facing referral path and next conversation prompts.</p>
          </div>
          <form
            class="form-grid"
            data-subscribe
            data-tags="EXISTING_PATIENT"
            action="https://thelongevitylab.us19.list-manage.com/subscribe/post?u=6c3200ab5c7b624854df21a77&amp;id=bee36545c8&amp;f_id=0083a0e3f0"
            method="post"
            data-success="You are on the existing-patient path. Please check your inbox for the next step."
            data-error="That did not go through. Please check the email address and try again."
          >
            <input type="hidden" name="SOURCE" value="patient-referral" />
            <input type="hidden" name="tags" value="6333535" />
            <label>Email <input type="email" name="EMAIL" required autocomplete="email" /></label>
            <button class="button" type="submit">Continue</button>
          </form>
          <p class="form-status" data-form-status aria-live="polite"></p>
        </div>
      </div>
    </main>
  </body>
</html>
